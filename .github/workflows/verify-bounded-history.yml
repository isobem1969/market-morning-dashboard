name: Verify bounded history status
on:
  push:
    branches: [fix/bounded-history-status-20261122]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TEST_BASE_URL: http://127.0.0.1:8773/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
      - run: npx playwright install --with-deps chromium webkit
      - run: python3 -m http.server 8773 --bind 127.0.0.1 --directory public > /tmp/market-http.log 2>&1 &
      - run: node --test tests/data-health.test.mjs tests/high-history.test.mjs tests/high-condition.test.mjs
      - run: node tests/high-history-browser.mjs
      - run: BROWSER=webkit node tests/high-history-browser.mjs
      - run: node tests/resilient-browser.mjs
      - run: BROWSER=webkit node tests/resilient-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-history-status-verification
          path: screenshots/navigation*
