name: Verify restored history document
on:
  push:
    branches: [fix/acquired-history-range-20261122]
    paths: ['tests/navigation-live.mjs', '.github/workflows/verify-history-return.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TEST_BASE_URL: http://127.0.0.1:8773/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
      - run: npx playwright install --with-deps chromium webkit
      - run: python3 -m http.server 8773 --bind 127.0.0.1 --directory public > /tmp/market-http.log 2>&1 &
      - run: node tests/navigation-live.mjs
      - run: BROWSER=webkit node tests/navigation-live.mjs
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-return-verification
          path: screenshots/navigation*
