name: Verify live page navigation
on:
  push:
    paths:
      - '.github/workflows/verify-navigation.yml'
      - 'tests/navigation-live.mjs'
      - 'tests/progress-browser.mjs'
      - 'public/page-ready-alert.*'
      - 'public/page-warm.js'
      - 'public/stocks-logic.js'
      - 'tests/stock-date-cache.test.mjs'
      - 'public/sw.js'
      - 'public/fund-panel.*'
      - 'tests/ready-alert.test.js'
      - 'public/common-header.css'
      - 'public/high-condition.*'
      - 'public/data-health.*'
      - 'public/high-history.js'
      - 'public/stocks-reference.js'
      - 'tests/high-history*'
      - 'public/funds-overview.js'
      - 'scripts/source_support.py'
      - 'scripts/update_health_calendar.py'
      - 'tests/resilient-browser.mjs'
      - 'tests/data-health.test.mjs tests/high-history.test.mjs'
      - 'public/stock-alerts.js'
      - 'tests/threshold-browser.mjs'
      - 'scripts/update_rsi.py'
      - 'tests/header-browser.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_BASE_URL: http://127.0.0.1:8773/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
      - run: npx playwright install --with-deps chromium webkit
      - name: Start local app
        run: python3 -m http.server 8773 --bind 127.0.0.1 --directory public > /tmp/market-http.log 2>&1 &
      - run: node --test tests/ready-alert.test.js tests/stock-date-cache.test.mjs tests/six-pages.test.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install exchange-calendars==4.13.2
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/update_health_calendar.py
      - run: node --test tests/data-health.test.mjs tests/high-history.test.mjs
      - run: node tests/high-history-browser.mjs
      - run: BROWSER=webkit node tests/high-history-browser.mjs
      - run: node tests/resilient-browser.mjs
      - run: BROWSER=webkit node tests/resilient-browser.mjs
      - run: node --test tests/high-condition.test.mjs
      - run: node tests/threshold-browser.mjs
      - run: BROWSER=webkit node tests/threshold-browser.mjs
      - run: node tests/header-browser.mjs
      - run: BROWSER=webkit node tests/header-browser.mjs
      - run: node tests/progress-browser.mjs
      - run: BROWSER=webkit node tests/progress-browser.mjs
        if: always()
      - run: node tests/six-pages-browser.mjs
      - run: BROWSER=webkit node tests/six-pages-browser.mjs
      - run: node tests/navigation-live.mjs
      - run: BROWSER=webkit node tests/navigation-live.mjs
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-verification
          path: screenshots/navigation*


