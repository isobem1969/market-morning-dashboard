name: Verify live page navigation
on:
  push:
    paths:
      - '.github/workflows/verify-navigation.yml'
      - 'tests/navigation-live.mjs'
      - 'tests/progress-browser.mjs'
      - 'public/page-ready-alert.*'
      - 'public/page-warm.js'
      - 'public/stocks-logic.js'
      - 'tests/stock-date-cache.test.mjs'
      - 'public/sw.js'
      - 'public/fund-panel.*'
      - 'tests/ready-alert.test.js'
      - 'public/common-header.css'
      - 'tests/header-browser.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_BASE_URL: http://127.0.0.1:8773/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
      - run: npx playwright install --with-deps chromium webkit
      - name: Start local app
        run: python3 -m http.server 8773 --bind 127.0.0.1 --directory public > /tmp/market-http.log 2>&1 &
      - run: node --test tests/ready-alert.test.js tests/stock-date-cache.test.mjs tests/six-pages.test.js
      - run: node tests/header-browser.mjs
      - run: BROWSER=webkit node tests/header-browser.mjs
      - run: node tests/progress-browser.mjs
      - run: BROWSER=webkit node tests/progress-browser.mjs
        if: always()
      - run: node tests/six-pages-browser.mjs
      - run: BROWSER=webkit node tests/six-pages-browser.mjs
      - run: node tests/navigation-live.mjs
      - run: BROWSER=webkit node tests/navigation-live.mjs
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-verification
          path: screenshots/navigation*


