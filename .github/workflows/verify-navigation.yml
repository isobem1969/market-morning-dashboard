name: Verify live page navigation
on:
  push:
    paths:
      - '.github/workflows/verify-navigation.yml'
      - 'tests/navigation-live.mjs'
      - 'public/page-ready-alert.*'
      - 'tests/ready-alert.test.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node --test tests/ready-alert.test.js
      - run: node tests/navigation-live.mjs
      - run: BROWSER=webkit node tests/navigation-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-verification
          path: screenshots/navigation*


