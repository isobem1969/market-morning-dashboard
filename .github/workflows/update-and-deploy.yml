name: Update market data and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: market-morning-publish
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/logic.test.js tests/stocks.test.js tests/research-import.test.js
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Collect public source data
        run: |
          python scripts/update_data.py
          python scripts/update_drawdowns.py
          python scripts/update_stocks.py
      - name: Install browser test dependencies
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium webkit
      - name: Verify mobile display and interactions
        if: github.event_name == 'workflow_dispatch'
        run: |
          node tests/browser.mjs
          node tests/stocks-browser.mjs
          node tests/research-browser.mjs
          node tests/reference-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: mobile-screenshots
          path: screenshots
      - name: Save observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/market.json public/data/stocks.json public/data/fund-drawdowns.json
          if ! git diff --cached --quiet; then
            git commit -m "Update market observations"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: market-data
          path: public/data/market.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
