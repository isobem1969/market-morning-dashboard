name: Verify US ETF panel move
on:
  push:
    branches: [fix/us-etf-move-20261123]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_BASE_URL: http://127.0.0.1:8773/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.62.1 pngjs@7.0.0
      - run: npx playwright install --with-deps chromium webkit
      - run: python3 -m http.server 8773 --bind 127.0.0.1 --directory public > /tmp/market-http.log 2>&1 &
      - run: node --test tests/us-etf-move.test.mjs tests/data-health.test.mjs tests/ready-alert.test.js
      - run: node tests/us-etf-browser.mjs
      - run: BROWSER=webkit node tests/us-etf-browser.mjs
      - run: node tests/progress-browser.mjs
      - run: BROWSER=webkit node tests/progress-browser.mjs
      - run: node tests/navigation-live.mjs
      - run: BROWSER=webkit node tests/navigation-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: us-etf-move-verification
          path: screenshots/navigation*
